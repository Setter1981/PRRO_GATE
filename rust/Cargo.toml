[workspace]
resolver = "2"
members = [
    "prro_crypto",
    "prro_crypto_v2",
    "prro_sidecar",
    "maria304_driver",
    "prro_escpos",
    "prro_escpos_daemon",
    "prro",
    # CS-1 architecture-consolidation skeleton (contract §8 item 1). Empty
    # crates for now; `prro-domain` receives the pure model in CS-1b/b′/c,
    # `prro-testkit` is dev-only shared test scaffolding (publish = false).
    "prro-domain",
    "prro-testkit",
    # CS-1d (contract §8 item 5): the three EMPTY boundary-contract crates —
    # crate boundaries only, no ports/traits/types/deps yet (those land in
    # specs #3–5 / CS-6). RP-CS1-4 (prro-domain/tests/rp_cs1_4_contract_dag.rs)
    # pins that each reaches no adapter/IO crate and that the three stay
    # orthogonal (ingress ⊥ dps ⊥ fleet). All `publish = false`.
    "prro-ingress-contract",
    "prro-dps-contract",
    "prro-fleet-contract",
]

# Profiles apply ONLY from the workspace root — the [profile.release]
# sections that lived in prro_crypto/Cargo.toml and prro_sidecar/Cargo.toml
# were silently IGNORED by cargo (audit CRY-2, 2026-06-10). Moved here to
# enact the original intent (max-optimized release crypto/sidecar).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# LOAD-BEARING (audit CRY-2): parser panics on semi-hostile network bytes
# (DPS envelopes via `unwrap_envelope`, CA CMP responses via
# `fetch_cert_by_ski`) are CONTAINED by `tokio::task::spawn_blocking` +
# JoinError→CryptoError mapping (prro/src/crypto/in_process.rs) — a panic
# becomes a typed per-request error, NOT process death. That containment
# requires unwinding. Do NOT set panic = "abort" (e.g. for binary size):
# it would turn malformed network input into a gateway crash mid-shift.
panic = "unwind"
