[package]
name = "maria304_driver"
version = "0.1.0"
edition = "2021"
description = "Virtual Maria 304 fiscal register TCP emulator — ingress bridge to PRRO Gateway"

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "1.0"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
tracing    = "0.1"
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
serde_json = "1"
tokio      = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "sync", "io-util"] }

[lints.clippy]
pedantic = "warn"
