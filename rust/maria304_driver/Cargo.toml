[package]
name = "maria304_driver"
version = "0.1.0"
edition = "2021"
description = "Virtual Maria 304 fiscal register TCP emulator — ingress bridge to PRRO Gateway"

[lib]
path = "src/lib.rs"

[[bin]]
name = "maria304_driver"
path = "src/bin/maria304_driver.rs"

[dependencies]
thiserror = "1.0"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "signal"] }
tokio-util = "0.7"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum       = { version = "0.7",  features = ["json", "tokio"] }
tower      = "0.5"
serde_yaml = "0.9"
sha2       = "0.10"

[dev-dependencies]
serde_json = "1"
tokio      = { version = "1", features = ["net", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
tokio-util = "0.7"

[lints.clippy]
pedantic = "warn"
