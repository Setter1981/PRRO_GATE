[package]
name = "prro_sidecar"
version = "0.1.0"
edition = "2021"
description = "Rust fiscal driver sidecar — canonical JSON → cp1251 XML → CMS sign → DPS gRPC"

[lib]
name = "prro_sidecar"

[dependencies]
# Existing crypto library — used as-is, not modified.
prro_crypto = { path = "../prro_crypto", features = ["tsp_http"] }

# Web server + async runtime
axum               = { version = "0.7",  features = ["json", "tokio"] }
tokio              = { version = "1",    features = ["full"] }

# gRPC client (DPS sendChkV2)
tonic              = { version = "0.12", features = ["tls", "tls-roots"] }
prost              = "0.13"

# HTTP (TSP RFC 3161)
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# SQLite (shared DB with Python gateway)
rusqlite           = { version = "0.32", features = ["bundled", "chrono"] }

# Config / CLI
toml               = "0.8"
clap               = { version = "4.5",  features = ["derive"] }

# Encoding / serialization
serde              = { version = "1.0",  features = ["derive"] }
serde_json         = "1.0"
hex                = "0.4"
base64             = "0.22"
encoding_rs        = "0.8"

# Hashing (XOR-soft credential obfuscation key derivation)
sha2               = "0.10"

# CSPRNG for license key generation (matches version used by prro_crypto)
rand_core          = { version = "0.6", features = ["getrandom"] }

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3",  features = ["env-filter", "json"] }

# Time
time               = { version = "0.3",  features = ["macros", "formatting", "parsing"] }

# Per-FN operator key cache (cleared on SIGHUP)
dashmap            = "6"

# Error handling
thiserror          = "1.0"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[[bin]]
name = "prro_sidecar"
path = "src/bin/prro_sidecar.rs"

[[bin]]
name = "prro_admin"
path = "src/bin/prro_admin.rs"

[[bin]]
name = "prro_license_keygen"
path = "src/bin/prro_license_keygen.rs"

[[bin]]
name = "prro_license_sign"
path = "src/bin/prro_license_sign.rs"

[[bin]]
name = "prro_license_verify"
path = "src/bin/prro_license_verify.rs"

[[bin]]
name = "prro_sidecar_preflight"
path = "src/bin/prro_sidecar_preflight.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
