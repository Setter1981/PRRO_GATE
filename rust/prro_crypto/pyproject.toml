[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "prro_crypto"
version = "0.1.0a1"
description = "Ukrainian DSTU 4145 crypto for PRRO fiscal gateway"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[tool.maturin]
features = ["python"]
module-name = "prro_crypto"
