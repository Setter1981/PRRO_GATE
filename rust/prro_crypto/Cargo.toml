[package]
name = "prro_crypto"
version = "0.1.0-alpha.1"
edition = "2021"
license = "BSD-3-Clause"
description = "Ukrainian DSTU 4145 crypto for PRRO fiscal gateway"
authors = ["PRRO_GATE contributors"]
repository = "https://github.com/prro-gateway/prro-crypto"
keywords = ["cryptography", "dstu", "dstu4145", "ukraine", "fiscal"]
categories = ["cryptography"]
readme = "README.md"

[lib]
name = "prro_crypto"
# rlib only: the "cdylib" target existed solely for the pyo3 extension
# module of the dead Python contour (removed 2026-06-11 with the
# `python` feature — RUSTSEC-2025-0020 root removal).
crate-type = ["rlib"]

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
sha1 = "0.10"
thiserror = "1.0"
# CMS/CAdES-BES builder (Phase 4 Sprint 1)
cms = { version = "0.2", features = ["builder"] }
x509-cert = { version = "0.2", features = ["pem"] }
const-oid = "0.9"
der = { version = "0.7", features = ["oid", "alloc"] }
spki = { version = "0.7", features = ["alloc"] }
# CSPRNG for per-sign rand_e. `getrandom` is the backend; `rand_core`
# gives us the OsRng facade. Locked 2026-04-15 per expert review B1.
rand_core = { version = "0.6", features = ["getrandom"] }
# Constant-time primitive wrappers. Sprint 2.1c5.2: cswap_fe and the
# masked-select helpers route through `subtle::ConditionallySelectable`
# so the CT story survives future compiler updates that might otherwise
# re-derive "this branch was always taken" and restore a conditional
# form. `subtle` also inserts its own opacity barriers inside `Choice`
# operations — belt-and-braces on top of our own masked-XOR patterns.
subtle = { version = "2.6", default-features = false }
# Secret wiping. `FieldEl`, `Scalar`, and `DstuInProcessSigner` call
# `zeroize` on drop so raw key material doesn't linger on the heap
# after use. `zeroize` uses `core::ptr::write_volatile` under a compiler
# fence — see the crate's security notes for why this survives LLVM
# optimisation passes that would otherwise elide the clear.
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# Blocking HTTP client for TSP (RFC 3161) round-trips. Gated behind the
# `tsp_http` feature so anyone who wants a crypto-only build (say, Python
# caller does the HTTP themselves) can skip the transitive network stack.
# `rustls` instead of native-tls to avoid OpenSSL on the build machine.
ureq = { version = "2.10", default-features = false, features = ["tls"], optional = true }

[features]
default = ["tsp_http"]
# Enables `cms::tsp::fetch_timestamp` — a blocking HTTP TSP client.
# Turn off for no-network embeddings (the ASN.1 encoder/parser stays
# available either way).
tsp_http = ["dep:ureq"]
# DANGEROUS: enables deterministic rand_e from a user-supplied seed.
# ONLY for test vectors / reproducible fuzzing. MUST NOT be enabled in
# production builds — it trivially breaks DSTU 4145 security proof.
dangerous_deterministic_k_for_tests = []
# Legacy jkurwa short_sign wire format adapter. Off by default.
# Enable only when a relying party still expects pre-CMS jkurwa output.
legacy_jkurwa_interop = []

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "crypto"
harness = false

# [profile.release] moved to the WORKSPACE ROOT Cargo.toml (audit CRY-2,
# 2026-06-10): member-package profiles are silently ignored by cargo.
