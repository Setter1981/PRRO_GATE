[package]
name = "prro_escpos"
version = "0.1.0"
edition = "2021"
description = "ESC/POS receipt-printer bytecode compiler driven by SoftBalance XML profiles"

[lib]
name = "prro_escpos"

[dependencies]
quick-xml = { version = "0.36", features = ["serialize"] }
serde     = { version = "1",     features = ["derive"] }
hex       = "0.4"
thiserror = "1"
encoding_rs = "0.8"

[dev-dependencies]
pretty_assertions = "1"
