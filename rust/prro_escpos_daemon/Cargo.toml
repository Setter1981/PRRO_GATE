[package]
name = "prro_escpos_daemon"
version = "0.1.0"
edition = "2021"
description = "Universal ESC/POS print daemon — HTTP JSON API + TCP/Serial/USB transport"

[[bin]]
name = "prro_escpos_daemon"
path = "src/main.rs"

[lib]
name = "prro_escpos_daemon"
path = "src/lib.rs"

[dependencies]
prro_escpos = { path = "../prro_escpos" }

axum = { version = "0.7", features = ["json", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"

clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

anyhow = "1"
thiserror = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
