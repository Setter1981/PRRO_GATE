app_name: prro-gateway
version: 1.4.1
database:
  db_path: ./var/prro_gateway.sqlite3
  sql_dir: ./sql
  auto_migrate: true
defaults:
  fiscal_number: FN-DEFAULT
  backend_profile_id: backend_checkbox_default
  transport_profile_id: transport_checkbox_rest_default
  channel_owner: runtime
runtime:
  process_immediately: false
  worker_lease_owner: runtime-worker
  startup_ready: true
  reconcile_on_startup: true
  startup_phase2_budget_seconds: 300
  graceful_shutdown_timeout_seconds: 30
ingress:
  rest:
    enabled: true
    host: 127.0.0.1
    port: 8080
    response_timeout_seconds: 60
  xmlrpc:
    enabled: true
    host: 127.0.0.1
    port: 8090
  maria:
    enabled: true
    host: 127.0.0.1
    port: 8100
    line_delimited_json: true
logging:
  level: INFO
  json_logs: true
metrics:
  enabled: true
  include_process: true
alerts:
  enabled: true
  persist_to_audit: true

# ── Fiscal Sidecar V2 (Rust prro_sidecar) ──────────────────────────────
# Uncomment to route fiscal documents through the Rust signing sidecar.
# The sidecar owns: canonical JSON → cp1251 XML → CMS sign → DPS gRPC.
#
# Required conditions:
#   1. crypto.provider = passthrough  (Python layer must NOT sign — sidecar signs internally)
#   2. prro_sidecar binary running on sidecar_url
#   3. Transport profile transport_sidecar_v2_default active in DB (seeded by migration 018)
#   4. prro_bindings for the fiscal_number pointing at transport_sidecar_v2_default
#
# crypto:
#   provider: passthrough
#   sidecar_url: http://127.0.0.1:8765  # also used as FiscalSidecarTransport base URL
