name: rust-prro-skip

# Skip-companion for the REQUIRED `x86_64-unknown-linux-gnu` status check (the
# rust-prro gnu leg). `rust-prro.yml` is path-filtered to rust/**, so on a PR
# that does NOT touch rust it never runs — and a REQUIRED check that never
# reports sits "Expected — waiting" forever and blocks the PR (the path-filter
# trap). This workflow triggers on exactly the COMPLEMENTARY paths and reports
# the same context green, so a non-rust PR (e.g. docs only) is mergeable without
# building rust.
#
# The job `name:` MUST equal the rust-prro gnu-leg context
# (`x86_64-unknown-linux-gnu`, from `name: ${{ matrix.target }}`) so GitHub sees
# the same required context. On a MIXED PR (rust + non-rust files) BOTH this and
# rust-prro run and both report the context; the real gnu leg (~7 min) finishes
# LAST and is therefore authoritative — a regression there still blocks the merge.
on:
  pull_request:
    paths-ignore:
      - 'rust/prro/**'
      - 'rust/prro_crypto/**'
      - 'rust/prro_escpos/**'
      - 'rust/Cargo.*'
      - '.github/workflows/rust-prro.yml'

# Least-privilege: reports a status only.
permissions:
  contents: read

concurrency:
  group: rust-prro-skip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gnu-skip:
    # MUST match the rust-prro gnu-leg context name exactly.
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - name: No rust changes — report required context green
        run: |
          echo "This PR changes no rust/** files, so the rust-prro gnu leg is"
          echo "skipped. Reporting the required 'x86_64-unknown-linux-gnu' context"
          echo "green so the PR is not blocked by the path-filter trap."
