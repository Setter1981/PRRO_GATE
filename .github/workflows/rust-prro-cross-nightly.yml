name: rust-prro-cross-nightly

# Cross-target half of the former per-PR rust-prro matrix (musl / msvc /
# aarch64), moved off the PR critical path (operator decision 2026-07-07):
# these legs validate compile/codegen for targets a typical PR cannot break,
# while the x86_64-gnu leg — the REQUIRED check carrying the full test
# signal — stays per-PR in rust-prro.yml. Keep the two files' step lists in
# sync when touching build/test steps.
#
# Runs nightly against the default branch, plus `workflow_dispatch` — use
# manual dispatch on a branch to pre-validate a release-ish / transport- or
# cfg-heavy PR on all targets BEFORE merge.
#
# NOT a required PR status check. Failures surface in the Actions tab only;
# remote alerting is a pre-pilot monitoring backlog item.
on:
  schedule:
    # 03:00 UTC — an hour after fuzzer-nightly (02:00) so the two nightly
    # workflows do not stack on the runner quota at the same minute.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Default to least-privilege: this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: rust-prro-cross-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Use the committed `.sqlx/` cache so the build does not need a live DB.
  SQLX_OFFLINE: "true"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt: musl-tools
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            apt: ''
          # Native ARM64 runner (GitHub-hosted, free for public repos).
          # Validates aarch64 codegen for embedded / edge gateway boxes
          # without cross-compile overhead.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            apt: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install apt deps (Linux musl)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Parallel per-binary test runner — ~2× wall-clock vs `cargo test`
      # (measured 300s→150s locally, 2026-06-11).  No crate in the
      # workspace has doc-tests, so nothing is silently skipped.
      - uses: taiki-e/install-action@nextest

      - name: Build
        working-directory: rust
        run: cargo build -p prro --target ${{ matrix.target }} --locked

      - name: Compile-only check — W4-Z3 live-dps smoke harness (never executed)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        working-directory: rust
        # The live-dps test target is gated `#![cfg(feature = "live-dps")]` and
        # hits the REAL DPS server, so it is NEVER run in CI.  This step only
        # COMPILES it (--no-run) so the harness cannot bit-rot (API drift in
        # transports/dps, crypto, or env wiring) while normal suites stay green.
        run: cargo test -p prro --target ${{ matrix.target }} --features live-dps --test live_dps_extended_smoke --no-run --locked

      - name: Test (cross-target binary)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        working-directory: rust
        # --features test-support: required by integration tests that
        # call `boot_phase::run_boot_reconciliation` via the W2
        # ReconcileGuard test seam (M3b structural enforcement of
        # ADR-M3-A10). Production builds do NOT enable this feature.
        run: cargo nextest run -p prro --target ${{ matrix.target }} --features test-support --locked

      - name: Test prro_crypto (vectors, dudect CT, backend differential)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        working-directory: rust
        # Audit CRY-3 (2026-06-10): the crypto crate's OWN suite (DSTU/GOST
        # vectors, the dudect constant-time statistical tests, the
        # portable↔pclmul backend differential) previously ran only by hand.
        # Per-target matters here: x86 exercises the PCLMUL backend, aarch64
        # the portable one. ~70s warm on a dev box.
        run: cargo nextest run -p prro_crypto --target ${{ matrix.target }} --locked

      # Disk headroom for the musl leg: it is the ONLY leg that performs TWO
      # full builds (the musl-target `Build` above + the host-gnu test build
      # below).  On a cache miss that overflows the runner disk — observed
      # twice on 2026-07-02 (`rustc-LLVM ERROR: No space left on device`
      # mid-host-build; the first occurrence killed the runner outright, which
      # also cancels `if: always()` steps — the same family as the earlier gnu
      # link-time No-space flake).  The musl target artifacts are dead weight
      # once `Build` has proven the target compiles — drop them before the
      # host build.
      - name: Free musl target artifacts (disk headroom for the host build)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: rust
        run: |
          du -sh target/x86_64-unknown-linux-musl 2>/dev/null || true
          rm -rf target/x86_64-unknown-linux-musl
          df -h / | tail -1

      - name: Test (musl built for target, executed on host gnu)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: rust
        # Native execution on the host gnu runner — the musl `cargo build`
        # above proves the target compiles; tests run via host gnu because
        # GH ubuntu-latest doesn't ship a musl libc by default.
        # --features test-support: see W2 note on the cross-target step.
        run: cargo nextest run -p prro --features test-support --locked

      # Phase-2 U2 (spec §4 / F2): the fuzzer above writes a regression seed to
      # the pinned file on a find. Surface it so a find is never silently dropped:
      # (1) upload the seed as a PER-TARGET artifact so a find's repro is
      # preserved before the ephemeral runner is torn down — including a
      # Windows-specific find (audit HIGH#2: the Windows leg runs the fuzzer
      # natively on windows-latest); (2) fail loudly if it is uncommitted/
      # untracked. Runs on EVERY OS leg (bash is available on the windows
      # runner via Git Bash) and regardless of whether the test step above
      # failed, so a find is surfaced as THIS guard, not just a raw failure.
      - name: Upload regression seed (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-fuzzer-regressions-${{ matrix.target }}
          path: rust/prro/tests/invariant_fuzzer.regressions
          if-no-files-found: ignore
          retention-days: 30

      - name: Guard — committed fuzzer regression seed
        if: always()
        shell: bash
        run: bash rust/prro/tests/check_seed_committed.sh
