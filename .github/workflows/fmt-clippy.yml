name: fmt-clippy

# The `fmt + clippy (gnu)` job is the REQUIRED merge gate on `main` (branch
# protection). It lives in its OWN workflow with NO path filter so it runs on
# EVERY pull request — including docs-only / .claude-only PRs that don't touch
# rust/. A path-filtered required check would otherwise stay "Expected — waiting"
# on non-rust PRs (the workflow never triggers) and block them forever. The
# fmt+clippy job is fast (~30-60s); the EXPENSIVE cross-target build matrix stays
# path-filtered in rust-prro.yml (it is NOT a required check). Keep the job name
# EXACTLY "fmt + clippy (gnu)" — branch protection matches the required status
# check by this name.
on:
  push:
    branches: [main, rust-gateway]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fmt-clippy-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  fmt-and-clippy:
    name: fmt + clippy (gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust
      - name: cargo fmt --check
        working-directory: rust
        # prro_crypto/prro_escpos joined the fmt gate in the CRY-4 lint-debt
        # pass (2026-06-11) — both crates were fmt-standardized then.
        # prro-domain/prro-testkit joined in CS-1a (contract §8 / RP-CS1-6);
        # the three `*-contract` crates joined in CS-1d (contract §8 item 5).
        # prro_crypto_v2/prro_sidecar/maria304_driver/prro_escpos_daemon joined
        # in CS-1R R1.3 (contract §12 member×dimension matrix) — every workspace
        # member now carries a fmt leg, no silent blanks.
        run: cargo fmt -p prro -p prro_crypto -p prro_crypto_v2 -p prro_sidecar -p maria304_driver -p prro_escpos -p prro_escpos_daemon -p prro-domain -p prro-testkit -p prro-ingress-contract -p prro-dps-contract -p prro-fleet-contract -- --check
      - name: cargo clippy (-D warnings, crate-scoped)
        working-directory: rust
        # --features test-support: builds the integration test targets
        # that consume the W2 ReconcileGuard test seam. Production
        # builds never enable this feature.
        run: cargo clippy -p prro --all-targets --no-deps --features test-support --locked -- -D warnings
      - name: cargo clippy prro_crypto + prro_escpos (-D warnings)
        working-directory: rust
        # Lint-debt pass CRY-4 (2026-06-11) zeroed both crates; this gate
        # keeps them clean. Deliberate allows live at the source (core/mod.rs
        # explicit-index CT loops; fixture-mirror fields) — do not silence
        # new lints here, fix or justify them in code.
        run: cargo clippy -p prro_crypto -p prro_escpos --all-targets --no-deps --locked -- -D warnings

      - name: cargo clippy prro-domain + prro-testkit (-D warnings)
        working-directory: rust
        # CS-1a skeleton crates (contract §8 / RP-CS1-6). `--all-targets` lints
        # the purity-gate + trybuild-canary test targets too; keep them clean.
        run: cargo clippy -p prro-domain -p prro-testkit --all-targets --no-deps --locked -- -D warnings

      - name: cargo clippy contract crates (-D warnings)
        working-directory: rust
        # CS-1d boundary-contract skeleton crates (contract §8 item 5 / RP-CS1-6).
        # Empty for now, but scoped-linted so a crate-local change is never
        # SKIPPED. `--all-targets` covers any test target these crates grow later.
        run: cargo clippy -p prro-ingress-contract -p prro-dps-contract -p prro-fleet-contract --all-targets --no-deps --locked -- -D warnings

      - name: cargo clippy prro_sidecar (-D warnings)
        working-directory: rust
        # CS-1R R1.3 (contract §12 member×dimension matrix): prro_sidecar had NO
        # clippy leg before — verified CLEAN under `-D warnings --all-targets`
        # (2026-07-16), so it joins the required gate now.
        run: cargo clippy -p prro_sidecar --all-targets --no-deps --locked -- -D warnings

      - name: cargo clippy prro_crypto_v2 + maria304_driver + prro_escpos_daemon (-D warnings)
        working-directory: rust
        # Lint-debt pass (2026-07-16): the last three CS-1R R1.3-excluded crates
        # join the required gate, closing contract §12 (every member×dimension cell
        # is now filled — no silent clippy blank).
        #   * prro_crypto_v2      — CT-sensitive clean-room DSTU-4145 core. Its
        #                           pre-existing findings are GRANDFATHERED via a
        #                           crate-root `#![allow(...)]` block (src/lib.rs):
        #                           attributes-only, zero compiled-behaviour change.
        #                           This leg lints FUTURE crypto code; a per-finding
        #                           CT-aware cleanup is deferred (NEVER clippy --fix
        #                           constant-time crypto).
        #   * maria304_driver     — `too_many_lines` on dispatch_prepare fixed with
        #                           a scoped `#[allow]` (cohesive protocol dispatch)
        #                           + a trailing-comma test-fmt fix.
        #   * prro_escpos_daemon  — test-only byte-str lint fixed cleanly
        #                           (&[b'\n'] → b"\n"), behaviour-identical.
        run: cargo clippy -p prro_crypto_v2 -p maria304_driver -p prro_escpos_daemon --all-targets --no-deps --locked -- -D warnings
