name: rust-prro

# Per-PR half of the rust CI (operator decision 2026-07-07): ONLY the
# x86_64-unknown-linux-gnu leg — the REQUIRED branch-protection context that
# carries the full test signal (prro + prro_crypto suites + live-dps harness
# compile check). The cross-target legs (musl / msvc / aarch64) moved to
# .github/workflows/rust-prro-cross-nightly.yml (schedule + manual dispatch):
# they validate compile/codegen for targets a typical PR cannot break, and
# cost ~10 min of PR wall-clock (windows runner slowest). Keep the two files'
# step lists in sync when touching build/test steps.
on:
  push:
    branches: [rust-gateway]
    paths:
      # `prro` plus its workspace path-dependencies (rust/prro/Cargo.toml
      # references ../prro_crypto and ../prro_escpos), so a change there
      # also breaks `cargo build -p prro` and must trigger this workflow.
      - 'rust/prro/**'
      - 'rust/prro_crypto/**'
      - 'rust/prro_escpos/**'
      - 'rust/Cargo.*'
      - '.github/workflows/rust-prro.yml'
  pull_request:
    paths:
      - 'rust/prro/**'
      - 'rust/prro_crypto/**'
      - 'rust/prro_escpos/**'
      - 'rust/Cargo.*'
      - '.github/workflows/rust-prro.yml'

# Default to least-privilege: this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: rust-prro-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Use the committed `.sqlx/` cache so the build does not need a live DB.
  SQLX_OFFLINE: "true"

jobs:
  # `fmt + clippy (gnu)` (also a REQUIRED merge gate) lives in
  # .github/workflows/fmt-clippy.yml — an always-run, NON-path-filtered
  # workflow — so that required check reports on EVERY PR, including
  # docs-only / .claude-only ones that never trigger this path-filtered one.
  build:
    # MUST stay exactly `x86_64-unknown-linux-gnu`: this is the REQUIRED
    # branch-protection context, mirrored by rust-prro-skip.yml on non-rust
    # PRs (the skip-companion reports the same context name).
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Parallel per-binary test runner — ~2× wall-clock vs `cargo test`
      # (measured 300s→150s locally, 2026-06-11).  No crate in the
      # workspace has doc-tests, so nothing is silently skipped.
      - uses: taiki-e/install-action@nextest

      - name: Build
        working-directory: rust
        run: cargo build -p prro --target x86_64-unknown-linux-gnu --locked

      - name: Compile-only check — W4-Z3 live-dps smoke harness (never executed)
        working-directory: rust
        # The live-dps test target is gated `#![cfg(feature = "live-dps")]` and
        # hits the REAL DPS server, so it is NEVER run in CI.  This step only
        # COMPILES it (--no-run) so the harness cannot bit-rot (API drift in
        # transports/dps, crypto, or env wiring) while normal suites stay green.
        run: cargo test -p prro --target x86_64-unknown-linux-gnu --features live-dps --test live_dps_extended_smoke --no-run --locked

      - name: Test
        working-directory: rust
        # --features test-support: required by integration tests that
        # call `boot_phase::run_boot_reconciliation` via the W2
        # ReconcileGuard test seam (M3b structural enforcement of
        # ADR-M3-A10). Production builds do NOT enable this feature.
        run: cargo nextest run -p prro --target x86_64-unknown-linux-gnu --features test-support --locked

      - name: Test prro_crypto (vectors, dudect CT, backend differential)
        working-directory: rust
        # Audit CRY-3 (2026-06-10): the crypto crate's OWN suite (DSTU/GOST
        # vectors, the dudect constant-time statistical tests, the
        # portable↔pclmul backend differential) previously ran only by hand.
        # This x86 leg exercises the PCLMUL backend; the portable backend
        # (aarch64) is covered by the nightly cross workflow.
        run: cargo nextest run -p prro_crypto --target x86_64-unknown-linux-gnu --locked

      # Phase-2 U2 (spec §4 / F2): the fuzzer above writes a regression seed to
      # the pinned file on a find. Surface it so a find is never silently
      # dropped: (1) upload the seed as an artifact so a find's repro is
      # preserved before the ephemeral runner is torn down; (2) fail loudly if
      # it is uncommitted/untracked. Runs regardless of whether the test step
      # above failed, so a find is surfaced as THIS guard, not just a raw
      # failure.
      - name: Upload regression seed (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-fuzzer-regressions-x86_64-unknown-linux-gnu
          path: rust/prro/tests/invariant_fuzzer.regressions
          if-no-files-found: ignore
          retention-days: 30

      - name: Guard — committed fuzzer regression seed
        if: always()
        shell: bash
        run: bash rust/prro/tests/check_seed_committed.sh
