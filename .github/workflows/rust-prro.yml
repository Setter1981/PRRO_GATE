name: rust-prro

on:
  push:
    branches: [rust-gateway]
    paths:
      - 'rust/prro/**'
      - 'rust/Cargo.*'
      - '.github/workflows/rust-prro.yml'
  pull_request:
    paths:
      - 'rust/prro/**'
      - 'rust/Cargo.*'
      - '.github/workflows/rust-prro.yml'

# Cancel superseded runs on the same ref.
concurrency:
  group: rust-prro-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Use the committed `.sqlx/` cache so the build does not need a live DB.
  SQLX_OFFLINE: "true"

jobs:
  fmt-and-clippy:
    name: fmt + clippy (gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt -p prro -- --check
      - name: cargo clippy (-D warnings, crate-scoped)
        working-directory: rust
        # Crate-scoped on purpose: workspace-wide clippy is not a T16 gate
        # until prro_crypto / prro_escpos get their own hardening pass.
        run: cargo clippy -p prro --all-targets --no-deps -- -D warnings

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt: musl-tools
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            apt: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            apt: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install apt deps (Linux musl)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        working-directory: rust
        run: cargo build -p prro --target ${{ matrix.target }} --locked

      - name: Test (cross-target binary)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        working-directory: rust
        run: cargo test -p prro --target ${{ matrix.target }} --locked

      - name: Test (musl built for target, executed on host gnu)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: rust
        # Native execution on the host gnu runner — the musl `cargo build`
        # above proves the target compiles; tests run via host gnu because
        # GH ubuntu-latest doesn't ship a musl libc by default.
        run: cargo test -p prro --locked
