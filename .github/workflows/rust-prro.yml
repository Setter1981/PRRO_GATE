name: rust-prro

# Per-PR half of the rust CI (operator decision 2026-07-07): ONLY the
# x86_64-unknown-linux-gnu leg — the REQUIRED branch-protection context that
# carries the full test signal (prro + prro_crypto suites + live-dps harness
# compile check). The cross-target legs (musl / msvc / aarch64) moved to
# .github/workflows/rust-prro-cross-nightly.yml (schedule + manual dispatch):
# they validate compile/codegen for targets a typical PR cannot break, and
# cost ~10 min of PR wall-clock (windows runner slowest). Keep the two files'
# step lists in sync when touching build/test steps.
on:
  push:
    branches: [rust-gateway]
    paths:
      # `prro` plus its workspace path-dependencies (rust/prro/Cargo.toml
      # references ../prro_crypto and ../prro_escpos), so a change there
      # also breaks `cargo build -p prro` and must trigger this workflow.
      - 'rust/prro/**'
      - 'rust/prro_crypto/**'
      - 'rust/prro_escpos/**'
      # CS-1 skeleton crates (contract §8 / RP-CS1-6): a change confined to the
      # new `prro-domain` / `prro-testkit` must NOT get a skipped build — they
      # are workspace members `cargo build --workspace` compiles and the purity
      # gate lives in `prro-domain`.
      - 'rust/prro-domain/**'
      - 'rust/prro-testkit/**'
      # CS-1d (contract §8 item 5 / RP-CS1-6): the three empty boundary-contract
      # crates get the same treatment — a change confined to one must be
      # built/linted, never SKIPPED.
      - 'rust/prro-ingress-contract/**'
      - 'rust/prro-dps-contract/**'
      - 'rust/prro-fleet-contract/**'
      - 'rust/Cargo.*'
      - '.github/workflows/rust-prro.yml'
  # pull_request is deliberately UNFILTERED: the required
  # `x86_64-unknown-linux-gnu` context must be authoritative on EVERY PR.
  # The old scheme (paths-filter here + a same-named 3s skip-companion in
  # rust-prro-skip.yml) had a bypass on MIXED PRs (docs+rust): BOTH workflows
  # fired and the skip's instant green could satisfy branch protection before
  # the real test leg finished (observed on #228). Now ONE workflow always
  # triggers; the `changes` job diffs the PR and the build job is SKIPPED
  # (which satisfies a required check) only when NO rust-relevant file
  # changed — a single authoritative context, no duplicate-name race.
  pull_request:

# Default to least-privilege: this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: rust-prro-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Use the committed `.sqlx/` cache so the build does not need a live DB.
  SQLX_OFFLINE: "true"

jobs:
  # `fmt + clippy (gnu)` (also a REQUIRED merge gate) lives in
  # .github/workflows/fmt-clippy.yml — an always-run, NON-path-filtered
  # workflow — so that required check reports on EVERY PR.

  # Detect whether the PR touches rust-relevant paths. The pattern list MUST
  # mirror the push-trigger `paths` above. On push events this job reports
  # rust=true unconditionally (pushes are already path-filtered).
  changes:
    name: detect rust changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          files=$(git diff --name-only "$base" HEAD)
          echo "changed files:"; echo "$files"
          # CS-1R2 A1: the detector MUST cover EVERY input the `build` job
          # gates, else a PR touching only an uncovered path SKIPS the required
          # x86_64 context (= satisfied) — the exact #305 bypass (only
          # prro_crypto_v2 / prro_sidecar / maria304 / escpos_daemon + the
          # cs1r inventory changed, x86_64 skipped, merged green-but-unsound).
          # Cover ALL of `rust/**` (all 13 workspace members build+test here),
          # the cs1r inventory gate's scripts + committed manifests, and this
          # workflow. `scripts/cs1r/manifest_detector_paths.py` asserts this
          # pattern ⊇ every member dir + every gate-input path (RED on drift).
          if echo "$files" | grep -qE '^(rust/|scripts/cs1r/|docs/cs1r/inventory/|\.github/workflows/rust-prro\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # MUST stay exactly `x86_64-unknown-linux-gnu`: this is the REQUIRED
    # branch-protection context. On non-rust PRs this job is SKIPPED via the
    # `if:` below — GitHub treats a skipped required check as satisfied, so
    # docs-only PRs stay mergeable WITHOUT a same-named skip-companion
    # workflow (rust-prro-skip.yml is retired; its mixed-PR bypass with it).
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 — the CS-1R R1 provenance test (`cs1_test_provenance`)
      # shells `git show f2c17b1:… / f2628ba:…` to compare the CS-1 base/head
      # blobs; a shallow (depth-1) checkout lacks those commits and the test
      # panics. Full history makes both pinned SHAs reachable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Parallel per-binary test runner — ~2× wall-clock vs `cargo test`
      # (measured 300s→150s locally, 2026-06-11).  No crate in the
      # workspace has doc-tests, so nothing is silently skipped.
      # CS-1R R1.2: PIN cargo-nextest to 0.9.137 (was `@nextest` = latest). The
      # inventory gate's `nextest list` snapshots are version-sensitive, so the
      # committed manifests are only reproducible against a pinned runner; cargo
      # is already pinned to 1.95.0 via rust-toolchain.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.137

      - name: Build
        working-directory: rust
        run: cargo build -p prro --target x86_64-unknown-linux-gnu --locked

      - name: Compile-only check — W4-Z3 live-dps smoke harness (never executed)
        working-directory: rust
        # The live-dps test target is gated `#![cfg(feature = "live-dps")]` and
        # hits the REAL DPS server, so it is NEVER run in CI.  This step only
        # COMPILES it (--no-run) so the harness cannot bit-rot (API drift in
        # transports/dps, crypto, or env wiring) while normal suites stay green.
        run: cargo test -p prro --target x86_64-unknown-linux-gnu --features live-dps --test live_dps_extended_smoke --no-run --locked

      - name: Test
        working-directory: rust
        # --features test-support: required by integration tests that
        # call `boot_phase::run_boot_reconciliation` via the W2
        # ReconcileGuard test seam (M3b structural enforcement of
        # ADR-M3-A10). Production builds do NOT enable this feature.
        run: cargo nextest run -p prro --target x86_64-unknown-linux-gnu --features test-support --locked

      - name: Test prro_crypto (vectors, dudect CT, backend differential)
        working-directory: rust
        # Audit CRY-3 (2026-06-10): the crypto crate's OWN suite (DSTU/GOST
        # vectors, the dudect constant-time statistical tests, the
        # portable↔pclmul backend differential) previously ran only by hand.
        # This x86 leg exercises the PCLMUL backend; the portable backend
        # (aarch64) is covered by the nightly cross workflow.
        run: cargo nextest run -p prro_crypto --target x86_64-unknown-linux-gnu --locked

      - name: Test prro-domain (RP-CS1-1 purity gate + RP-CS1-4 contract-DAG + testkit graph-absence)
        working-directory: rust
        # CS-1 skeleton (contract §8 / RP-CS1-6): the `prro-domain` crate carries
        # the cargo-metadata purity gate (sqlx/tonic/tokio/axum/prost/hyper/reqwest
        # must never enter its normal+build+target closure), the RP-CS1-4
        # `prro-testkit` graph-absence check AND the CS-1d contract-crate DAG gate
        # (rp_cs1_4_contract_dag.rs: the three `*-contract` crates carry no
        # adapter/IO dep and stay orthogonal — ingress ⊥ dps ⊥ fleet), plus the
        # trybuild canary. Also compiles the (currently empty) `prro-testkit` +
        # the three `*-contract` members so a crate-local change is linted/tested,
        # never SKIPPED.
        run: cargo nextest run -p prro-domain -p prro-testkit -p prro-ingress-contract -p prro-dps-contract -p prro-fleet-contract --target x86_64-unknown-linux-gnu --locked

      # CS-1R R1.3 (contract §12 member×dimension matrix): the remaining five
      # workspace members had NO build/test leg on the required x86 context — a
      # crate-local break in prro_crypto_v2 / prro_sidecar / maria304_driver /
      # prro_escpos / prro_escpos_daemon was SKIPPED. Every member now carries
      # build + test (all five ship test targets: crypto_v2 21 src, sidecar
      # 1 int+10 src, maria304 10 int+27 src, escpos/escpos_daemon 1 int each).
      - name: Build CS-1R matrix members (crypto_v2 / sidecar / maria304 / escpos / escpos_daemon)
        working-directory: rust
        run: cargo build -p prro_crypto_v2 -p prro_sidecar -p maria304_driver -p prro_escpos -p prro_escpos_daemon --target x86_64-unknown-linux-gnu --locked

      - name: Test CS-1R matrix members (crypto_v2 / sidecar / maria304 / escpos / escpos_daemon)
        working-directory: rust
        run: cargo nextest run -p prro_crypto_v2 -p prro_sidecar -p maria304_driver -p prro_escpos -p prro_escpos_daemon --target x86_64-unknown-linux-gnu --locked

      # CS-1R R1.2: forward additions-only inventory gate (three-way: live
      # `nextest list` == committed manifest per profile, additions-only vs base,
      # every new source test file recorded). Pins cargo-nextest to 0.9.137 (the
      # install-action step below). A drift RED's here; a human re-mints via
      # scripts/cs1r/mint_manifests.sh (CI never auto-mints).
      - name: CS-1R R1.2 inventory gate (three-way, --pr base)
        run: bash scripts/cs1r/inventory_gate.sh --pr "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request'

      - name: CS-1R R1.2 inventory gate (controls 1+3, push)
        run: bash scripts/cs1r/inventory_gate.sh
        if: github.event_name != 'pull_request'

      # Phase-2 U2 (spec §4 / F2): the fuzzer above writes a regression seed to
      # the pinned file on a find. Surface it so a find is never silently
      # dropped: (1) upload the seed as an artifact so a find's repro is
      # preserved before the ephemeral runner is torn down; (2) fail loudly if
      # it is uncommitted/untracked. Runs regardless of whether the test step
      # above failed, so a find is surfaced as THIS guard, not just a raw
      # failure.
      - name: Upload regression seed (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-fuzzer-regressions-x86_64-unknown-linux-gnu
          path: rust/prro/tests/invariant_fuzzer.regressions
          if-no-files-found: ignore
          retention-days: 30

      - name: Guard — committed fuzzer regression seed
        if: always()
        shell: bash
        run: bash rust/prro/tests/check_seed_committed.sh
