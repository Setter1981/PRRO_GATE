name: rust-prro

on:
  push:
    branches: [rust-gateway]
    paths:
      # `prro` plus its workspace path-dependencies (rust/prro/Cargo.toml
      # references ../prro_crypto and ../prro_escpos), so a change there
      # also breaks `cargo build -p prro` and must trigger this matrix.
      - 'rust/prro/**'
      - 'rust/prro_crypto/**'
      - 'rust/prro_escpos/**'
      - 'rust/Cargo.*'
      - '.github/workflows/rust-prro.yml'
  pull_request:
    paths:
      - 'rust/prro/**'
      - 'rust/prro_crypto/**'
      - 'rust/prro_escpos/**'
      - 'rust/Cargo.*'
      - '.github/workflows/rust-prro.yml'

# Default to least-privilege: this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: rust-prro-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Use the committed `.sqlx/` cache so the build does not need a live DB.
  SQLX_OFFLINE: "true"

jobs:
  fmt-and-clippy:
    name: fmt + clippy (gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt -p prro -- --check
      - name: cargo clippy (-D warnings, crate-scoped)
        working-directory: rust
        # Crate-scoped on purpose: workspace-wide clippy is not a T16 gate
        # until prro_crypto / prro_escpos get their own hardening pass.
        # --features test-support: builds the integration test targets
        # that consume the W2 ReconcileGuard test seam. Production
        # builds never enable this feature.
        run: cargo clippy -p prro --all-targets --no-deps --features test-support -- -D warnings

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt: musl-tools
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            apt: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            apt: ''
          # Native ARM64 runner (GitHub-hosted, free for public repos).
          # Validates aarch64 codegen for embedded / edge gateway boxes
          # without cross-compile overhead.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            apt: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install apt deps (Linux musl)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        working-directory: rust
        run: cargo build -p prro --target ${{ matrix.target }} --locked

      - name: Test (cross-target binary)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        working-directory: rust
        # --features test-support: required by integration tests that
        # call `boot_phase::run_boot_reconciliation` via the W2
        # ReconcileGuard test seam (M3b structural enforcement of
        # ADR-M3-A10). Production builds do NOT enable this feature.
        run: cargo test -p prro --target ${{ matrix.target }} --features test-support --locked

      - name: Test (musl built for target, executed on host gnu)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        working-directory: rust
        # Native execution on the host gnu runner — the musl `cargo build`
        # above proves the target compiles; tests run via host gnu because
        # GH ubuntu-latest doesn't ship a musl libc by default.
        # --features test-support: see W2 note on the cross-target step.
        run: cargo test -p prro --features test-support --locked
