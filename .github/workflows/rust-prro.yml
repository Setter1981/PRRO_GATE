name: rust-prro

# Per-PR half of the rust CI (operator decision 2026-07-07): ONLY the
# x86_64-unknown-linux-gnu leg — the REQUIRED branch-protection context that
# carries the full test signal (prro + prro_crypto suites + live-dps harness
# compile check). The cross-target legs (musl / msvc / aarch64) moved to
# .github/workflows/rust-prro-cross-nightly.yml (schedule + manual dispatch):
# they validate compile/codegen for targets a typical PR cannot break, and
# cost ~10 min of PR wall-clock (windows runner slowest). Keep the two files'
# step lists in sync when touching build/test steps.
on:
  # CS-1R4 — the integrity check is UNCONDITIONAL. push.paths is deliberately
  # UNFILTERED (was `rust/** + scripts/cs1r/** + docs/cs1r/inventory/** + this
  # file`) so the `x86_64-unknown-linux-gnu` context — the required
  # branch-protection gate — ALWAYS runs on both push and pull_request, on EVERY
  # ref, with no dispatch to defeat. The CS-1R4 simplification DELETED the old
  # `changes` (detect rust changes) job + `scripts/cs1r/rust_change_paths.py` +
  # `scripts/cs1r/manifest_detector_paths.py`: a path-detector is an attackable
  # surface (a PR touching only an uncovered path SKIPPED the required context =
  # satisfied — the #305 bypass class; plus every rename/glob/negation/comment-
  # injection trick against the detector). Removing the gate removes the whole
  # class. The trade-off (this leg now runs on genuinely docs-only PRs too) is
  # accepted: correctness of the required gate outranks a few minutes of CI on
  # rare docs-only PRs, and the heavy mutation ratchet stays path-filtered in
  # mutation-diff.yml.
  push:
    branches: [rust-gateway]
  pull_request:

# Default to least-privilege: this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: rust-prro-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Use the committed `.sqlx/` cache so the build does not need a live DB.
  SQLX_OFFLINE: "true"

jobs:
  # `fmt + clippy (gnu)` (also a REQUIRED merge gate) lives in
  # .github/workflows/fmt-clippy.yml — an always-run, NON-path-filtered
  # workflow — so that required check reports on EVERY PR.
  #
  # CS-1R4 — there is NO `changes` (detect rust changes) dispatch job any more.
  # The `build` job below is a single, non-matrix, ALWAYS-RUN job with no `needs:`
  # / `if:` gate: the required `x86_64-unknown-linux-gnu` context runs its full
  # integrity signal on EVERY push and EVERY PR and can only report green by
  # actually passing every step. Deleting a step, adding `if: false` /
  # `continue-on-error` / `|| true`, or changing the `checkout` ref weakens a
  # VISIBLE part of this job's diff (CODEOWNERS-gated, see .github/CODEOWNERS) and
  # still leaves the job itself fail-closed. Structural weakening is a workflow-
  # file diff, which branch protection (operator) must gate — the code here is
  # deliberately un-dispatchable.

  build:
    # MUST stay exactly `x86_64-unknown-linux-gnu`: this is the REQUIRED
    # branch-protection context. It runs UNCONDITIONALLY (no `needs:`/`if:`) —
    # CS-1R4 removed the path-detector dispatch that previously SKIPPED it on
    # out-of-path PRs (the #305 skip-the-required bypass class). A skipped
    # required check counts as satisfied, so any detector was an attackable
    # surface; running always removes the class entirely.
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest

    # Serial compile+link (one codegen/link job at a time). The ubuntu-latest
    # runner (~7 GB) intermittently OOMs the `lld` linker
    # (`ld terminated with signal 7 [Bus error], core dumped`) when linking the
    # ~200 workspace test binaries in parallel, failing this REQUIRED context
    # non-deterministically — observed 4/5 link attempts on PR #338, in BOTH the
    # `Test` step and the inventory-gate `nextest list`, always on unrelated
    # binaries (`cert_refresher_smoke`, `live_dps_extended_smoke`, …). `-j1` caps
    # peak link memory deterministically. Scoped to THIS heavy x86 job only;
    # nextest RUNTIME parallelism is untouched (the OOM is at LINK, before any
    # test runs). If serial build later hits the step timeout, raise the timeout
    # before reintroducing parallelism.
    # 2026-08-01 — `mold` + `-j2`, replacing the `-j1` + `lld` combination above.
    #
    # The serialisation was the right call against a NON-DETERMINISTIC required
    # check, but it is expensive: linking ~220 test binaries one at a time is why
    # this leg costs 16-26 minutes while the same 2362 tests run locally in ~170
    # SECONDS. The tests are not the cost; the links are.
    #
    # `mold` attacks the actual constraint rather than working around it: its peak
    # RSS per link is a fraction of `lld`'s (it does not build the full symbol
    # graph in memory the same way), which is exactly the quantity that was
    # OOM-ing this 7 GB runner. So the parallelism can come back — conservatively,
    # `-j2` rather than `nproc`, because the failure this replaces was
    # intermittent and a regression would again show up as a flaky REQUIRED check.
    #
    # `line-tables-only` below STAYS. It is an independent peak-memory cap and
    # removing it would confound this change with a second variable.
    #
    # IF THIS REGRESSES: the signature is the documented
    # `ld terminated with signal 7 [Bus error]` on an unrelated binary. Revert in
    # this order — first `CARGO_BUILD_JOBS` back to "1" (keeping mold, which is
    # still faster per link), and only then the linker itself.
    #
    # MEASURING IT: the first run after this lands is a FULL rebuild (RUSTFLAGS is
    # part of the cache key), so compare the SECOND run against the 16-26 min
    # baseline, not the first.
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # Peak-link-memory cap (bd PRRO_GATE-hpc, 2026-07-30). `-j1` above serialises
      # the links but does NOT bound the peak of a SINGLE link, and debug info is the
      # dominant contributor: once this PR added the ~201st test binary the
      # inventory-gate `nextest list` link began dying with the SAME documented
      # `ld terminated with signal 7 [Bus error]` on 3/3 consecutive attempts (a
      # sibling PR on the identical base linked fine, so it is a threshold, not a
      # code defect). `line-tables-only` keeps file:line in panics and backtraces —
      # the only debug info CI actually reads — while dropping the type/variable DWARF
      # that dominates link peak. Applied to BOTH profiles: test targets link their
      # dependencies' `dev`-profile debug info too, so capping `test` alone is not
      # enough. Scoped to THIS heavy x86 job; local dev builds are untouched.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

    steps:
      # fetch-depth: 0 — the CS-1R R1 provenance test (`cs1_test_provenance`)
      # shells `git show f2c17b1:… / f2628ba:…` to compare the CS-1 base/head
      # blobs; a shallow (depth-1) checkout lacks those commits and the test
      # panics. Full history makes both pinned SHAs reachable.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      # `mold` from the distro rather than a third-party action: every action in
      # these workflows is SHA-pinned, and apt keeps that supply-chain surface at
      # the runner image instead of adding another pinned repo to audit.
      # FAIL-CLOSED: if the install or the version probe fails the job stops here,
      # because RUSTFLAGS below names `-fuse-ld=mold` unconditionally — a missing
      # binary would otherwise surface as an opaque link error much later.
      - name: install mold (linker — see the -j2 rationale in this job's env)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mold
          mold --version

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      # Parallel per-binary test runner — ~2× wall-clock vs `cargo test`
      # (measured 300s→150s locally, 2026-06-11).  No crate in the
      # workspace has doc-tests, so nothing is silently skipped.
      # CS-1R R1.2: PIN cargo-nextest to 0.9.137 (was `@nextest` = latest). The
      # inventory gate's `nextest list` snapshots are version-sensitive, so the
      # committed manifests are only reproducible against a pinned runner; cargo
      # is already pinned to 1.95.0 via rust-toolchain.toml.
      - uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2
        with:
          tool: nextest@0.9.137

      # ── CS-1R4 addendum (2026-07-31): the docs-only fast path ─────────────
      #
      # The CS-1R4 comment at the top of this file accepted "a few minutes of CI
      # on rare docs-only PRs". They are not rare — landing accumulated docs is a
      # routine move here, and each one paid ~25 min for a leg that compiled
      # nothing new. This step buys that back WITHOUT reopening the #305 bypass
      # class, and the distinction is the whole point:
      #
      #   THE BYPASS (removed by CS-1R4, must never return): the JOB is skipped,
      #   so the required context NEVER REPORTS — and branch protection treats a
      #   missing required check as satisfied. A PR touching an uncovered path
      #   sailed through.
      #
      #   THIS (safe): the job ALWAYS runs and ALWAYS reports the required
      #   context. It decides INTERNALLY whether the expensive legs apply. There
      #   is no `paths:` filter, no dispatch job, no `if:` on the job itself, and
      #   nothing GitHub-provided to spoof — the change set is computed HERE, in
      #   the job, from git.
      #
      # FAIL-CLOSED BY CONSTRUCTION: `heavy` starts `true` and is only ever
      # cleared on the ONE path where every changed file matched the inert
      # allowlist. No usable base sha, a base not present in the checkout, a
      # failed `git diff`, an EMPTY diff, or any unrecognised path all leave it
      # `true`. There is no branch that sets `heavy=false` by omission.
      #
      # THE ALLOWLIST IS DELIBERATELY TINY, and everything that can influence a
      # build or a gate is excluded ON PURPOSE: `rust/**`, `.github/**`,
      # `scripts/**`, `Cargo.*`, `**/.sqlx/**`, and `docs/cs1r/**` (the CS-1
      # inventory manifests live there — a docs path that CAN move the gate).
      # Renames are split into both endpoints (`--no-renames`), so moving a file
      # OUT of `rust/` still trips the non-inert arm.
      #
      # WIDENING THIS LIST IS A WORKFLOW DIFF, hence CODEOWNERS-gated
      # (`.github/CODEOWNERS: /.github/workflows/**`) — the same owner review the
      # CS-1R4 design relies on. `cs1r4_integrity_job_coverage.rs` additionally
      # PINS the properties above, so quietly turning this into a bypass fails a
      # test rather than shipping.
      - name: Scope — do the heavy legs apply? (FAIL-CLOSED)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          heavy=true
          reason='default — fail-closed'
          files=''
          case "$EVENT_NAME" in
            pull_request) base="${PR_BASE_SHA:-}" ;;
            push)         base="${PUSH_BASE_SHA:-}" ;;
            *)            base='' ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            reason="no usable base sha for event '$EVENT_NAME'"
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            reason="base sha $base not present in this checkout"
          elif ! files="$(git diff --name-only --no-renames "$base" HEAD 2>/dev/null)"; then
            reason='git diff against the base failed'
          elif [ -z "$files" ]; then
            reason='empty diff — refusing to treat as inert'
          else
            inert=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/cs1r/*) inert=false ;;
                docs/*)      ;;
                .beads/*)    ;;
                *.md)        case "$f" in */*) inert=false ;; esac ;;
                *)           inert=false ;;
              esac
              if ! $inert; then reason="non-inert path: $f"; break; fi
            done <<< "$files"
            if $inert; then
              heavy=false
              reason='every changed path is inert (docs/** except docs/cs1r/**, .beads/**, root *.md)'
            fi
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### Integrity-leg scope"
            echo ""
            echo "- heavy legs: **$heavy**"
            echo "- reason: $reason"
            echo ""
            echo "<details><summary>changed files vs base</summary>"
            echo ""
            echo '```'
            echo "${files:-<none>}"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "scope: heavy=$heavy ($reason)"

      - name: Build
        if: steps.scope.outputs.heavy == 'true'
        working-directory: rust
        run: cargo build -p prro --target x86_64-unknown-linux-gnu --locked

      - name: Compile-only check — W4-Z3 live-dps smoke harness (never executed)
        if: steps.scope.outputs.heavy == 'true'
        working-directory: rust
        # The live-dps test target is gated `#![cfg(feature = "live-dps")]` and
        # hits the REAL DPS server, so it is NEVER run in CI.  This step only
        # COMPILES it (--no-run) so the harness cannot bit-rot (API drift in
        # transports/dps, crypto, or env wiring) while normal suites stay green.
        run: cargo test -p prro --target x86_64-unknown-linux-gnu --features live-dps --test live_dps_extended_smoke --no-run --locked

      - name: Test
        if: steps.scope.outputs.heavy == 'true'
        working-directory: rust
        # --features test-support: required by integration tests that
        # call `boot_phase::run_boot_reconciliation` via the W2
        # ReconcileGuard test seam (M3b structural enforcement of
        # ADR-M3-A10). Production builds do NOT enable this feature.
        run: cargo nextest run -p prro --target x86_64-unknown-linux-gnu --features test-support --locked

      - name: Test prro_crypto (vectors, dudect CT, backend differential)
        if: steps.scope.outputs.heavy == 'true'
        working-directory: rust
        # Audit CRY-3 (2026-06-10): the crypto crate's OWN suite (DSTU/GOST
        # vectors, the dudect constant-time statistical tests, the
        # portable↔pclmul backend differential) previously ran only by hand.
        # This x86 leg exercises the PCLMUL backend; the portable backend
        # (aarch64) is covered by the nightly cross workflow.
        run: cargo nextest run -p prro_crypto --target x86_64-unknown-linux-gnu --locked

      - name: Test prro-domain (RP-CS1-1 purity gate + RP-CS1-4 contract-DAG + testkit graph-absence)
        if: steps.scope.outputs.heavy == 'true'
        working-directory: rust
        # CS-1 skeleton (contract §8 / RP-CS1-6): the `prro-domain` crate carries
        # the cargo-metadata purity gate (sqlx/tonic/tokio/axum/prost/hyper/reqwest
        # must never enter its normal+build+target closure), the RP-CS1-4
        # `prro-testkit` graph-absence check AND the CS-1d contract-crate DAG gate
        # (rp_cs1_4_contract_dag.rs: the three `*-contract` crates carry no
        # adapter/IO dep and stay orthogonal — ingress ⊥ dps ⊥ fleet), plus the
        # trybuild canary. Also compiles the (currently empty) `prro-testkit` +
        # the three `*-contract` members so a crate-local change is linted/tested,
        # never SKIPPED.
        run: cargo nextest run -p prro-domain -p prro-testkit -p prro-ingress-contract -p prro-dps-contract -p prro-fleet-contract --target x86_64-unknown-linux-gnu --locked

      # CS-1R R1.3 (contract §12 member×dimension matrix): the remaining five
      # workspace members had NO build/test leg on the required x86 context — a
      # crate-local break in prro_crypto_v2 / prro_sidecar / maria304_driver /
      # prro_escpos / prro_escpos_daemon was SKIPPED. Every member now carries
      # build + test (all five ship test targets: crypto_v2 21 src, sidecar
      # 1 int+10 src, maria304 10 int+27 src, escpos/escpos_daemon 1 int each).
      - name: Build CS-1R matrix members (crypto_v2 / sidecar / maria304 / escpos / escpos_daemon)
        if: steps.scope.outputs.heavy == 'true'
        working-directory: rust
        run: cargo build -p prro_crypto_v2 -p prro_sidecar -p maria304_driver -p prro_escpos -p prro_escpos_daemon --target x86_64-unknown-linux-gnu --locked

      - name: Test CS-1R matrix members (crypto_v2 / sidecar / maria304 / escpos / escpos_daemon)
        if: steps.scope.outputs.heavy == 'true'
        working-directory: rust
        run: cargo nextest run -p prro_crypto_v2 -p prro_sidecar -p maria304_driver -p prro_escpos -p prro_escpos_daemon --target x86_64-unknown-linux-gnu --locked

      # CS-1R R1.2: forward additions-only inventory gate (three-way: live
      # `nextest list` == committed manifest per profile, additions-only vs base,
      # every new source test file recorded). Pins cargo-nextest to 0.9.137 (the
      # install-action step below). A drift RED's here; a human re-mints via
      # scripts/cs1r/mint_manifests.sh (CI never auto-mints).
      - name: CS-1R R1.2 inventory gate (three-way, --pr base)
        run: bash scripts/cs1r/inventory_gate.sh --pr "${{ github.event.pull_request.base.sha }}"
        if: github.event_name == 'pull_request' && steps.scope.outputs.heavy == 'true'

      - name: CS-1R R1.2 inventory gate (controls 1+3, push)
        run: bash scripts/cs1r/inventory_gate.sh
        if: github.event_name != 'pull_request' && steps.scope.outputs.heavy == 'true'

      # Phase-2 U2 (spec §4 / F2): the fuzzer above writes a regression seed to
      # the pinned file on a find. Surface it so a find is never silently
      # dropped: (1) upload the seed as an artifact so a find's repro is
      # preserved before the ephemeral runner is torn down; (2) fail loudly if
      # it is uncommitted/untracked. Runs regardless of whether the test step
      # above failed, so a find is surfaced as THIS guard, not just a raw
      # failure.
      - name: Upload regression seed (if any)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invariant-fuzzer-regressions-x86_64-unknown-linux-gnu
          path: rust/prro/tests/invariant_fuzzer.regressions
          if-no-files-found: ignore
          retention-days: 30

      - name: Guard — committed fuzzer regression seed
        if: always()
        shell: bash
        run: bash rust/prro/tests/check_seed_committed.sh
